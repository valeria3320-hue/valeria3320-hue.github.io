<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mentoría</title>
<style>
/* Layout: "bitácora de ruta" — the 5 MentorcliQ stages as a track across the top, then a tabbed workbook; session 1 is a minute-marked run-of-show with a side rail.
   Azules de IA: azul noche #0A1A3F, azul eléctrico #2563EB, cian #06B6D4; Calibri (sin fuentes de internet). */
:root {
  --paper: #f5f8ff;
  --card: #ffffff;
  --ink: #0a1a3f;
  --ink-2: #3d4f75;
  --ink-3: #64748b;
  --line: #d6e2f5;
  --line-2: #e8effb;
  --accent: #2563eb;      /* azul eléctrico */
  --accent-ink: #1d4ed8;
  --accent-soft: #e0ecff;
  --cyan: #0891b2;
  --jade: #047857;
  --jade-soft: #d1fae5;
  --rose: #be123c;
  --rose-soft: #fde2e7;
  --viz-base: #93c5fd;
  --viz-now: #1e40af;
  --on-ink: #f5f8ff;
  --shadow: 0 1px 2px rgba(10, 26, 63, .06), 0 6px 18px rgba(37, 99, 235, .08);
  --f-display: "Calibri", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Calibri", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Consolas", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #060b1e; --card: #0e1a3a; --ink: #ffffff; --ink-2: #cbd5e1; --ink-3: #8ea0c2;
    --line: #1f2f57; --line-2: #172447; --accent: #3b82f6; --accent-ink: #60a5fa; --accent-soft: #102a5c; --cyan: #22d3ee;
    --jade: #34d399; --jade-soft: #0f3a33; --rose: #fb7185; --rose-soft: #3b1626;
    --viz-base: #3b5b9a; --viz-now: #22d3ee; --on-ink: #060b1e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #060b1e; --card: #0e1a3a; --ink: #ffffff; --ink-2: #cbd5e1; --ink-3: #8ea0c2;
  --line: #1f2f57; --line-2: #172447; --accent: #3b82f6; --accent-ink: #60a5fa; --accent-soft: #102a5c; --cyan: #22d3ee;
  --jade: #34d399; --jade-soft: #0f3a33; --rose: #fb7185; --rose-soft: #3b1626;
  --viz-base: #3b5b9a; --viz-now: #22d3ee; --on-ink: #060b1e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--jade); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.dim { color: var(--ink-3); }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
.top { padding-block: 32px 8px; display: grid; gap: 22px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.eyebrow .lbl b { color: var(--accent-ink); font-weight: 700; }
.title-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
h1 { font-size: clamp(2.1rem, 5.4vw, 3.6rem); font-weight: 750; line-height: 1.02; }
h1 .x { color: var(--accent); font-weight: 600; padding: 0 .08em; }
.lede { color: var(--ink-2); max-width: 54ch; font-size: 16px; margin-top: 8px; }

.status { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 12px 14px 12px 0; display: grid; gap: 2px; min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat .v { font-family: var(--f-display); font-size: 1.32rem; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
.stat .s { font-size: 12.5px; color: var(--ink-3); }
.stat .s.warn { color: var(--rose); font-weight: 600; }

/* ---------- Stage track ---------- */
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.track::before { content: ""; position: absolute; left: 10%; right: 10%; top: 17px; height: 2px; background: var(--line); }
.track li { position: relative; display: flex; justify-content: center; }
.stage-btn { all: unset; cursor: pointer; display: grid; justify-items: center; text-align: center; gap: 6px; padding: 0 4px 6px; border-radius: 10px; }
.stage-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 14px; background: var(--paper); border: 2px solid var(--line); color: var(--ink-3); position: relative; z-index: 1; transition: transform .15s ease; }
.stage-btn:hover .node { transform: scale(1.06); }
.stage-name { font-family: var(--f-display); font-weight: 650; font-size: 14.5px; line-height: 1.2; }
.stage-en { font-size: 11.5px; color: var(--ink-3); font-style: italic; }
.track li.past .node { border-color: var(--jade); color: var(--jade); background: var(--jade-soft); }
.track li.now .node { border-color: var(--accent); background: var(--accent); color: #1d1300; transform: scale(1.12); box-shadow: 0 0 0 5px var(--accent-soft); }
.track li.now .stage-name { color: var(--ink); }
.track li:not(.now):not(.past) .stage-name { color: var(--ink-2); }

/* ---------- Tabs ---------- */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); margin-top: 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; padding-block: 8px; }
.tab { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { background: var(--line-2); color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.tab .count { font-family: var(--f-mono); font-size: 11.5px; opacity: .75; }

main { padding-block: 26px 40px; }
[role="tabpanel"] { scroll-margin-top: 72px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; margin-bottom: 18px; }
.panel-head h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); font-weight: 700; }
.panel-head p { color: var(--ink-2); max-width: 62ch; margin-top: 4px; }

/* ---------- Buttons, inputs ---------- */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); line-height: 1.2; }
.btn:hover { filter: brightness(1.12); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--line-2); filter: none; }
.btn.ai { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { all: unset; cursor: pointer; color: var(--jade); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); }
.spark { width: 15px; height: 15px; flex: none; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 12px; }
input[type="text"], input[type="date"], select, textarea {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 11px; font-size: 14.5px; line-height: 1.45; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--line-2); }
input:disabled, select:disabled, textarea:disabled { opacity: .7; cursor: not-allowed; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--jade); margin: 0; flex: none; }
input[type="range"] { width: 100%; accent-color: var(--viz-now); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.span2 { grid-column: 1 / -1; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.chip.warm { background: var(--accent-soft); color: var(--accent-ink); }
.chip.good { background: var(--jade-soft); color: var(--jade); }
.chip.bad { background: var(--rose-soft); color: var(--rose); }
.chip.warn { background: var(--accent-soft); color: var(--accent-ink); }

.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.box h3 { font-size: 1.08rem; font-weight: 700; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; margin-bottom: 16px; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--ink-2); display: grid; gap: 6px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 1.05rem; }
.empty .ex { font-size: 13.5px; color: var(--ink-3); }

/* ---------- Session 1 ---------- */
.s1 { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: start; }
.rail { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.clock { display: grid; gap: 10px; background: var(--ink); color: var(--on-ink); border-radius: 14px; padding: 16px 18px; }
.clock .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clock .time { font-family: var(--f-mono); font-size: 2.1rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.clock .time small { font-size: .95rem; opacity: .6; }
.clock .now-lbl { font-size: 13px; opacity: .85; }
.clock .bar { height: 6px; background: color-mix(in srgb, var(--on-ink) 18%, transparent); border-radius: 99px; overflow: hidden; }
.clock .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s linear; }
.clock .btns { display: flex; gap: 8px; }
.clock .btn { background: var(--accent); color: #1d1300; border-color: var(--accent); }
.clock .btn.ghost { background: transparent; color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.clock.over .time { color: var(--accent); }

.outcomes { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.outcomes li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: transparent; margin-top: 1px; }
.outcomes li.ok .tick { background: var(--jade); border-color: var(--jade); color: var(--card); }
.outcomes li .sub { display: block; font-size: 12.5px; color: var(--ink-3); }
.prep-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 9px; }
.prep-list label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; cursor: pointer; }
.prep-list input { margin-top: 2px; }
.prep-list input:checked + span { color: var(--ink-3); text-decoration: line-through; }
.tips { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }

.runsheet { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.blk { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 16px; position: relative; }
.blk-time { display: grid; align-content: start; justify-items: end; gap: 0; padding-top: 18px; font-size: 13px; }
.blk-time .mono:first-child { font-size: 15px; font-weight: 500; color: var(--ink); }
.blk-body { border-left: 2px solid var(--line); padding: 16px 0 26px 22px; display: grid; gap: 10px; position: relative; min-width: 0; }
.blk-body::before { content: ""; position: absolute; left: -7px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); }
.blk.done .blk-body::before { background: var(--jade); border-color: var(--jade); }
.blk.is-now .blk-body { border-left-color: var(--accent); }
.blk.is-now .blk-body::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.blk.is-now .blk-time .mono:first-child { color: var(--accent-ink); }
.blk-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; }
.blk-head .chip { grid-column: 1 / -1; justify-self: start; }
.blk-head h3 { font-size: 1.22rem; font-weight: 700; min-width: 0; }
.done-lbl { display: inline-flex; gap: 7px; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.aim { color: var(--ink); font-weight: 500; }
.aim::before { content: "Para lograr · "; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.how { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); }
.qs { display: grid; gap: 6px; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
.qs p { font-family: var(--f-display); font-size: 1.02rem; font-weight: 500; line-height: 1.35; }
.qs p + p { border-top: 1px solid var(--line-2); padding-top: 6px; }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); display: grid; gap: 4px; align-content: start; }
.opt b { font-family: var(--f-display); font-size: 1rem; }
.opt span { font-size: 13.5px; color: var(--ink-2); }
.inline-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.termo { display: inline-flex; gap: 6px; }
.termo button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; background: var(--card); }
.termo button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1d1300; }
.termo button:focus-visible { outline: 2px solid var(--accent); }
.termo button:disabled { cursor: not-allowed; opacity: .6; }
.blk textarea { min-height: 52px; font-size: 14px; }

/* ---------- Ruta ---------- */
.stages { display: grid; gap: 14px; }
.stage-card { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.stage-card.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stage-card .big { font-family: var(--f-display); font-size: 2.4rem; font-weight: 750; line-height: 1; color: var(--line); }
.stage-card.now .big { color: var(--accent); }
.stage-card.past .big { color: var(--jade); }
.stage-card .body { display: grid; gap: 10px; min-width: 0; }
.stage-card .hd { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.stage-card h3 { font-size: 1.25rem; font-weight: 700; }
.stage-card .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.stage-card .meta div { display: grid; gap: 2px; font-size: 14px; }
.stage-card ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 3px; font-size: 14px; }
.cadence { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.cadence span { font-family: var(--f-mono); font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }

/* ---------- Acuerdo ---------- */
.agr { display: grid; gap: 18px; }
.signs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sign { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
.sign.ok { border-color: var(--jade); background: var(--jade-soft); }
.sign b { font-family: var(--f-display); font-size: 1.02rem; display: block; }
.sign small { color: var(--ink-3); }
.saved-note { font-size: 12.5px; color: var(--ink-3); min-height: 1.2em; }

/* ---------- Metas ---------- */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.goal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.goal h3 { font-size: 1.12rem; font-weight: 700; }
.goal .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.smart { display: grid; gap: 6px; margin: 0; }
.smart div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.smart dt { font-family: var(--f-mono); font-weight: 500; color: var(--accent-ink); }
.smart dd { margin: 0; overflow-wrap: anywhere; }
.prog { display: grid; gap: 4px; }
.prog .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.meter { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--jade); border-radius: 99px; }
.card-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.form-box { margin-top: 22px; }
.form-box h3 { margin-bottom: 12px; }
.letter { font-family: var(--f-mono); color: var(--accent-ink); font-weight: 500; margin-right: 4px; }

/* ---------- Compromisos ---------- */
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 160px auto; gap: 10px; align-items: end; }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.act { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.act .t { font-weight: 500; overflow-wrap: anywhere; }
.act.done .t { text-decoration: line-through; color: var(--ink-3); }
.act .m { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); align-items: center; }
.x { all: unset; cursor: pointer; color: var(--ink-3); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--rose); background: var(--rose-soft); }
.x:focus-visible { outline: 2px solid var(--accent); }
.group-h { margin: 22px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.group-h h3 { font-size: 1.05rem; }

/* ---------- Bitácora ---------- */
.log-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.sessions { display: grid; gap: 12px; }
.ses { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.ses .hd { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.ses h3 { font-size: 1.1rem; }
.ses .sec { display: grid; gap: 2px; }
.ses .sec p { white-space: pre-line; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.prep-out { display: grid; gap: 10px; margin-top: 12px; }
.prep-out ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.prep-out ol li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.prep-out ol li .mono { color: var(--accent-ink); font-size: 12.5px; padding-top: 2px; }
.prep-out ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.ai-status { font-size: 13px; color: var(--ink-3); min-height: 1.2em; white-space: pre-line; }
.suggested { display: grid; gap: 6px; }
.suggested div { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; padding: 8px 10px; background: var(--accent-soft); border-radius: 9px; }
.suggested div span { min-width: 0; overflow-wrap: anywhere; }

/* ---------- Radar (dumbbell) ---------- */
.radar-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.chart { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.sw-base { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--viz-base); background: var(--card); }
.sw-now { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--viz-now); }
.db-axis, .db-row { display: grid; grid-template-columns: minmax(0, 10.5rem) minmax(0, 1fr) 2.6rem; gap: 12px; align-items: center; }
.db-axis .ticks { position: relative; height: 18px; margin: 0 9px; }
.db-axis .ticks span { position: absolute; transform: translateX(-50%); font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.db-row { padding: 9px 0; border-top: 1px solid var(--line-2); cursor: default; }
.db-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.db-row .name { font-weight: 600; font-size: 14px; line-height: 1.25; }
.db-track { position: relative; height: 26px; margin: 0 9px; }
.db-track .g { position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--line-2); }
.db-track .conn { position: absolute; top: 50%; height: 3px; margin-top: -1.5px; background: var(--viz-base); border-radius: 2px; }
.db-track .dot { position: absolute; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; }
.db-track .dot.base { background: var(--card); border: 3px solid var(--viz-base); }
.db-track .dot.now { background: var(--viz-now); box-shadow: 0 0 0 2px var(--card); }
.db-row .delta { font-family: var(--f-mono); font-size: 13px; text-align: right; color: var(--ink); font-weight: 500; }
.db-row .delta.zero { color: var(--ink-3); }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--on-ink); font-size: 13px; padding: 8px 10px; border-radius: 8px; box-shadow: var(--shadow); max-width: 260px; }
.scale-note { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
.rad-fields { display: grid; gap: 14px; }
.rad-f { display: grid; gap: 4px; }
.rad-f .top-l { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.rad-f .top-l b { font-weight: 600; }
.rad-f output { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent-ink); white-space: nowrap; }
.rad-f small { color: var(--ink-3); font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; margin-top: 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
td.num { font-family: var(--f-mono); text-align: center; }

/* ---------- Quién eres + lo que le toca a cada quien ---------- */
.whoami-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.whoami-bar.unset { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.whoami-bar .hint { font-size: 14px; color: var(--ink-2); }
.whoami-bar.unset .hint { color: var(--accent-ink); font-weight: 600; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo > div { border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.duo > div.is-me { border-color: var(--accent); background: var(--accent-soft); }
.duo .who { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.duo > div.is-me .who { color: var(--accent-ink); }
.duo .how { font-size: 14px; }
.prep-list li.prep-who { margin-top: 6px; }
.prep-list li.prep-who:first-child { margin-top: 0; }

/* ---------- Cada quien ---------- */
.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.part { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.part.me { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.part-hd { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.part-hd h3 { font-size: 1.55rem; font-weight: 750; margin-right: 4px; }
.part-motto { font-family: var(--f-display); font-size: 1.05rem; color: var(--ink-2); }
.part .sub { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.part .sub-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.part .tips { margin: 0; }
.part .prep-list { margin: 0; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.mini li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.mini li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.mini .mono { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.lock { font-size: 12.5px; color: var(--ink-3); }
.other-prog { font-size: 13px; color: var(--ink-2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-2); }
.sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; margin-top: 14px; }
.sg { border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.sg .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sg b { font-family: var(--f-display); font-size: 1.02rem; line-height: 1.3; font-weight: 650; }
.sg .m { font-size: 13px; color: var(--ink-2); }
.sg .foot { display: flex; justify-content: flex-end; margin-top: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--card); }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.goal-group { margin-top: 26px; }
.goal-group .group-h { margin-top: 0; }

footer { border-top: 1px solid var(--line); padding-block: 18px 36px; color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: center; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); transition: all .2s ease; z-index: 20; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 960px) {
  .s1 { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; order: -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rail .clock { grid-column: 1 / -1; }
  .log-grid, .radar-grid { grid-template-columns: minmax(0, 1fr); }
  .status { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat:nth-child(4) { border-left: 0; padding-left: 0; }
  .stat:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .rail { grid-template-columns: minmax(0, 1fr); }
  .status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(n) { border-left: 0; padding-left: 0; border-top: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); padding-left: 14px; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .track { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .track::before { left: 21px; right: auto; top: 18px; bottom: 18px; width: 2px; height: auto; }
  .track li { justify-content: flex-start; }
  .stage-btn { grid-template-columns: 36px minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 12px; row-gap: 0; align-items: center; padding: 3px 4px; }
  .stage-btn .node { grid-row: span 2; }
  .options, .grid2, .grid3, .signs, .stage-card .meta, .parts, .duo { grid-template-columns: minmax(0, 1fr); }
  .add-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add-row .field:first-child, .add-row .btn { grid-column: 1 / -1; }
  .blk { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
  .blk-body { padding-left: 16px; }
  .stage-card { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .db-axis, .db-row { grid-template-columns: minmax(0, 1fr) 2.6rem; }
  .db-row .name { grid-column: 1 / -1; }
  .db-axis > span:first-child { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Ciclo con proyecto ancla */
.ciclo-wrap { display: grid; gap: 4px; margin-bottom: 8px; }
.ciclo-anchor { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); border-radius: 14px; }
.ciclo-anchor .lbl { color: var(--accent-ink); }
.ciclo-anchor b { font-family: var(--f-display); font-size: 1.08rem; }
.ciclo { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ciclo > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.ciclo .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-size: 13px; color: var(--ink-2); }
.ciclo > li.ok .n { border-color: var(--jade); color: var(--jade); }
.ciclo .hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.ciclo p { color: var(--ink-2); margin-top: 4px; font-size: 14.5px; }
.ciclo p .lbl { margin-right: 8px; }
/* Escala del Radar */
.levels { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.levels li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
.levels .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; font-weight: 600; }
.levels .sub { display: block; color: var(--ink-2); font-size: 13.5px; }
.radar-0 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); margin-top: 16px; align-items: start; }
.radar-1 + .box { margin-top: 16px; }
@media (max-width: 760px) { .radar-0 { grid-template-columns: minmax(0, 1fr); } }
/* Listas de preparación y tablas con texto largo */
.ro-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.ro-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.ro-list li.ok .tick { background: var(--jade); border-color: var(--jade); color: var(--card); }
.ro-list li.ok > span:last-child { color: var(--ink-3); }
table.wrap td, .agr-table td { white-space: normal; vertical-align: top; }
.agr-table td:first-child { width: 36%; }
/* Mi demo y Prueba B (solo en la vista de Valeria) */
.stack { display: grid; gap: 18px; }
.stack > .group-h { margin: 6px 0 -8px; flex-wrap: wrap; }
.paste { margin: 12px 0 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; color: var(--ink-2); }
.q-next { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; margin: 8px 0 4px; }
table.guion td:first-child { white-space: nowrap; color: var(--ink-3); }
table.guion td:nth-child(2) { width: 52%; color: var(--ink); }
tfoot td { border-bottom: 0; border-top: 1.5px solid var(--line); }
/* Lecturas */
.lects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.lect { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.lect .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lect h3 { font-size: 1.08rem; }
.lect p { font-size: 14px; color: var(--ink-2); }
.lect p.dim { color: var(--ink-3); font-size: 13px; }
.lect .btn { justify-self: start; margin-top: 4px; }
a.chip { text-decoration: none; }
a.chip:hover { filter: brightness(.97); text-decoration: underline; }

/* ---------- Láminas de la sesión 1 (siempre oscuras, en azules de IA) ---------- */
html.lam-html, body.lam { height: 100%; overflow: hidden; }
body.lam {
  --lb: #060b1e; --lb2: #0e1a3a; --la: #3b82f6; --la2: #22d3ee; --li: #ffffff; --li2: #cbd5e1; --li3: #8ea0c2;
  --ll: rgba(148, 197, 255, .14); --lok: #34d399; --lobj: #fbbf24; --lreal: #6366f1;
  background: radial-gradient(1200px 700px at 85% -10%, rgba(34, 211, 238, .16), transparent 60%), radial-gradient(1000px 600px at -5% 110%, rgba(59, 130, 246, .2), transparent 60%), var(--lb);
  color: var(--li); font-family: "Calibri", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 22px; line-height: 1.4;
}
body.lam::before { display: none; }
body.lam h1, body.lam h2, body.lam h3 { font-family: inherit; }
#l-stage { position: fixed; inset: 0; overflow: hidden; }
#l-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; transition: transform 1100ms cubic-bezier(.22, .61, .36, 1); }
.l-frame { position: absolute; padding: 48px 56px; border-radius: 22px; background: var(--lb2); border: 1px solid var(--ll); box-shadow: 0 24px 70px rgba(0, 0, 0, .45); cursor: pointer; opacity: .5; transition: opacity .6s; }
.l-frame.l-on { opacity: 1; cursor: default; }
.l-kick { font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: var(--la2); font-weight: 700; margin-bottom: 14px; }
.l-h1 { font-size: 96px; line-height: 1.02; font-weight: 700; letter-spacing: -.02em; }
.l-h1 em { font-style: normal; background: linear-gradient(90deg, var(--la), var(--la2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.l-h2 { font-size: 48px; line-height: 1.14; font-weight: 700; letter-spacing: -.01em; }
.l-sub { font-size: 26px; color: var(--li2); margin-top: 14px; line-height: 1.45; }
.l-rule { height: 3px; width: 82px; background: var(--la); border-radius: 2px; margin: 22px 0 30px; }
.l-g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.l-g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.l-tile { border: 1px solid var(--ll); border-radius: 16px; padding: 24px 26px; background: rgba(255, 255, 255, .04); }
.l-tile.hl { border-top: 4px solid var(--la); }
.l-lab { font-size: 15px; letter-spacing: .13em; text-transform: uppercase; color: var(--li3); margin-bottom: 12px; line-height: 1.3; font-weight: 600; }
.l-val { font-size: 64px; font-weight: 700; letter-spacing: -.025em; line-height: 1; font-variant-numeric: tabular-nums; }
.l-val.acc { color: var(--la2); }
.l-val.ok { color: var(--lok); }
.l-tile p { font-size: 19px; color: var(--li2); margin-top: 12px; line-height: 1.4; }
.l-tile h3 { font-size: 25px; font-weight: 700; line-height: 1.22; }
.l-agenda { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 30px; }
.l-agenda div { border-left: 3px solid var(--la); padding: 4px 12px; display: grid; gap: 2px; align-content: start; }
.l-agenda b { color: var(--la2); font-size: 18px; }
.l-agenda span { font-size: 18px; line-height: 1.25; }
.l-agenda small { font-size: 15px; color: var(--li3); }
.l-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.l-pane { border: 1px solid var(--ll); border-radius: 16px; padding: 22px 26px; background: rgba(255, 255, 255, .035); }
.l-pane.me { border-left: 4px solid var(--la); }
.l-pane h3 { font-size: 15px; letter-spacing: .13em; text-transform: uppercase; color: var(--li3); font-weight: 600; margin-bottom: 12px; }
.l-pane ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 22px; }
.l-pane p { font-size: 20px; color: var(--li2); white-space: pre-line; }
.l-qs { display: grid; gap: 12px; }
.l-qs p { font-size: 25px; color: var(--li); font-weight: 600; line-height: 1.3; white-space: normal; }
.l-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.l-scale div { border: 1px solid var(--ll); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.l-scale b { font-size: 34px; color: var(--li3); }
.l-scale span { font-size: 17px; color: var(--li2); line-height: 1.2; }
.l-scale .hi { border-color: var(--la); background: rgba(59, 130, 246, .12); }
.l-scale .hi b { color: var(--la2); }
.l-areas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; }
.l-areas div { border-top: 3px solid var(--lreal); padding: 10px 2px 0; display: grid; gap: 4px; align-content: start; }
.l-areas b { font-size: 21px; }
.l-areas span { font-size: 16px; color: var(--li3); line-height: 1.3; }
.l-bars { display: grid; gap: 12px; }
.l-hb { display: grid; grid-template-columns: 300px 1fr 60px; gap: 18px; align-items: center; }
.l-hb .t { font-size: 22px; font-weight: 600; }
.l-hb .n { font-size: 26px; font-weight: 700; text-align: right; }
.l-hb .w { height: 22px; border-radius: 11px; background: rgba(255, 255, 255, .07); overflow: hidden; display: block; }
.l-hb .w i, .l-meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--la); transition: width 1.1s cubic-bezier(.22, .61, .36, 1); }
.l-frame.l-on .l-hb .w i, .l-frame.l-on .l-meter i { width: var(--to); }
.l-meter { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .08); margin-top: 16px; overflow: hidden; }
.l-agr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; }
.l-agr div { border-left: 3px solid var(--la); padding: 4px 0 4px 16px; display: grid; gap: 4px; align-content: start; }
.l-agr b { font-size: 21px; }
.l-agr span { font-size: 18px; color: var(--li2); line-height: 1.3; }
.l-agr span.dim { color: var(--li3); font-style: italic; }
.l-ancla { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; border: 1px solid var(--la); background: rgba(59, 130, 246, .12); border-radius: 14px; padding: 16px 22px; margin-bottom: 18px; }
.l-ancla span { font-size: 15px; letter-spacing: .13em; text-transform: uppercase; color: var(--la2); font-weight: 700; }
.l-ancla b { font-size: 26px; }
.l-thermo { display: flex; gap: 10px; }
.l-thermo span { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--ll); display: grid; place-items: center; font-size: 26px; font-weight: 700; }
.l-ciclo { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.l-ciclo div { border: 1px solid var(--ll); border-top: 4px solid var(--lreal); border-radius: 14px; padding: 18px; background: rgba(255, 255, 255, .035); display: grid; gap: 6px; align-content: start; }

      `<div class="group-h"><h3>Las 5 etapas de MentorcliQ</h3></div><div class="stages">${ETAPAS.map((s) => `<article class="stage-card ${s.n === stageNow ? "now" : s.n < stageNow ? "past" : ""}" id="stage-${s.n}">
        <div class="big">${s.n}</div><div class="body">
        <div class="hd"><h3>${esc(s.name)}</h3><span class="stage-en">${esc(s.en || "")}</span>${s.n === stageNow ? '<span class="chip warn">Etapa actual</span>' : s.n < stageNow ? '<span class="chip good">Recorrida</span>' : ""}</div>
        ${s.what ? `<p style="color: var(--ink-2)">${esc(s.what)}</p>` : ""}
        <div class="meta"><div><span class="lbl">Acción clave</span><span>${esc(s.key || "")}</span></div><div><span class="lbl">Cuándo</span><span>${esc(s.when || "")}</span></div></div>
        ${s.qs.length ? `<div><span class="lbl">Preguntas guía</span><ul>${s.qs.map(li).join("")}</ul></div>` : ""}
        </div></article>`).join("")}</div>`;
  }

  function panelLecturas() {
    if (!LECT.length) return head("Lecturas", "") + empty("Sin lecturas", hint("Lecturas"));
    const suyas = LECT.filter((l) => same(l.Persona, F)), mias = isV ? LECT.filter((l) => !same(l.Persona, F)) : [];
    const card = (l) => `<article class="lect"><div class="chips"><span class="chip warm">Sesión ${esc(l["Sesión"])}</span>${l.Formato ? `<span class="chip">${esc(l.Formato)}</span>` : ""}${l.Minutos ? `<span class="chip">${esc(l.Minutos)} min</span>` : ""}</div>
      <h3>${esc(l["Título"])}</h3>${l.Autor ? `<p class="dim">${esc(l.Autor)}</p>` : ""}${l["Por qué leerla"] ? `<p>${esc(l["Por qué leerla"])}</p>` : ""}
      ${okUrl(l.Liga) ? `<a class="btn small" href="${esc(l.Liga)}" target="_blank" rel="noopener">${/pdf/i.test(String(l.Formato)) ? "Descargar PDF" : "Leer en línea"}</a>` : ""}</article>`;

      `<div class="group-h"><h3>${isV ? "Para " + esc(F) : "Para ti"}</h3><span class="dim mono">${suyas.length}</span></div><div class="lects">${suyas.map(card).join("")}</div>` +
      (mias.length ? `<div class="group-h"><h3>Para mí</h3><span class="dim mono">${mias.length}</span></div><div class="lects">${mias.map(card).join("")}</div>` : "");

  function panelAcuerdo() {
    const rows = T("tblAcuerdo").filter((r) => r.Tema);

    const acc = ACEPT.length ? `<div class="signs">${ACEPT.map((r) => `<div class="sign ${yes(r["De acuerdo"]) ? "ok" : ""}"><span class="tick" aria-hidden="true">✓</span><span><b>${esc(r.Persona)}${yes(r["De acuerdo"]) ? " está de acuerdo" : ""}</b><small>${yes(r["De acuerdo"]) ? (r.Fecha ? "Aceptado el " + esc(fmtD(r.Fecha, { day: "numeric", month: "long" })) : "Aceptado") : "Pendiente"}</small></span></div>`).join("")}</div>` : "";
    return head("Acuerdo de mentoría", "Límites, metas y expectativas de la mentoría. Se llena juntos en la primera sesión y se revisa a mitad del ciclo.") + `<div class="agr">${tbl}${acc}</div>`;
  }

  function goalCard(g) {
    const [st, cls] = goalStatus(g), p = Math.round(pctOf(g) * 100);
    const row = (l, v) => (v ? `<div><dt>${l}</dt><dd>${esc(v)}</dd></div>` : "");
    return `<article class="goal"><div class="chips"><span class="chip ${cls}">${esc(st)}</span>${g["Área"] ? `<span class="chip">${esc(g["Área"])}</span>` : ""}${g["Fecha límite"] ? `<span class="chip">Para el ${esc(fmtD(g["Fecha límite"], { day: "numeric", month: "short", year: "numeric" }))}</span>` : ""}</div>
      <h3>${esc(g.Meta)}</h3><dl class="smart">${row("S", g["S · Específica"])}${row("M", g["M · Medible"])}${row("A", g["A · Alcanzable"])}${row("R", g["R · Relevante"])}</dl>
      <div class="prog"><div class="row"><span>Avance</span><span class="mono">${p} %</span></div><div class="meter"><i style="width:${p}%"></i></div></div></article>`;
  }
  const suggCards = (p) => SUGG(p).map((s) => `<div class="sg"><div class="chips">${s["Área"] ? `<span class="chip">${esc(s["Área"])}</span>` : ""}${s["Plazo (días)"] ? `<span class="chip">${esc(s["Plazo (días)"])} días</span>` : ""}</div><b>${esc(s.Meta)}</b>${s["M · Medible"] ? `<span class="m"><span class="letter">M</span>${esc(s["M · Medible"])}</span>` : ""}</div>`).join("");
  function panelMetas() {
    const group = (p, title) => { const g = GOALS(p); return `<div class="goal-group"><div class="group-h"><h3>${esc(title)}</h3><span class="dim mono">${g.length}</span></div>${g.length ? `<div class="goals">${g.map(goalCard).join("")}</div>` : empty("Aún sin metas", hint("Metas"))}</div>`; };
    const sugg = (p, title) => (SUGG(p).length ? `<div class="goal-group"><div class="group-h"><h3>${esc(title)}</h3></div><div class="sugg">${suggCards(p)}</div></div>` : "");
    return head(isV ? "Metas SMART" : "Tus metas SMART", "Específicas, medibles, alcanzables, relevantes y con fecha. El estado se calcula con la fecha límite y el avance.") +
      (isV ? group(F, "Metas de " + F) + group(M, "Mis metas") + sugg(F, "Sugeridas para " + F) + sugg(M, "Sugeridas para mí")
           : group(F, "Tus metas") + sugg(F, "Metas sugeridas"));
  }

  function panelCompromisos() {
    const item = (a) => { const d = daysTo(a["Para el"]), done = yes(a.Estado), over = !done && d != null && d < 0;
      return `<li class="act ${done ? "done" : ""}"><span class="tick-sm ${done ? "ok" : ""}" aria-hidden="true">✓</span><div style="min-width:0"><span class="t">${esc(a.Compromiso)}</span>
        <div class="m"><span class="chip">${esc(a.Responsable || "")}</span>${a["Para el"] ? `<span class="${over ? "chip bad" : ""}">${over ? "Venció " : "Para el "}${esc(fmtD(a["Para el"]))}</span>` : ""}${a.Estado && !done ? `<span>${esc(a.Estado)}</span>` : ""}${a["Meta relacionada"] ? `<span>Meta: ${esc(a["Meta relacionada"])}</span>` : ""}${a["Sesión"] ? `<span>Sesión ${esc(a["Sesión"])}</span>` : ""}</div></div><span></span></li>`; };
    const pend = ACTS.filter((a) => !yes(a.Estado)).sort((a, b) => String(a["Para el"] || "9").localeCompare(String(b["Para el"] || "9")));
    const done = ACTS.filter((a) => yes(a.Estado));
    return head("Compromisos entre sesiones", "Acciones pequeñas con dueño y fecha. Al inicio de cada sesión se revisan primero.") +
      (ACTS.length ? `<div class="group-h"><h3>Pendientes</h3><span class="dim mono">${pend.length}</span></div>${pend.length ? `<ul class="acts">${pend.map(item).join("")}</ul>` : `<p class="dim">Todo al día.</p>`}${done.length ? `<div class="group-h"><h3>Cumplidos</h3><span class="dim mono">${done.length}</span></div><ul class="acts">${done.map(item).join("")}</ul>` : ""}`
                   : empty("Sin compromisos todavía", hint("Compromisos")));
  }

  function panelBitacora() {
    const sec = (l, v) => (v ? `<div class="sec"><span class="lbl">${l}</span><p>${esc(v)}</p></div>` : "");
    return head("Bitácora de sesiones", "Qué se platicó, qué se aprendió y qué se acordó en cada sesión.") +
      (SES.length ? `<div class="sessions">${SES.map((s) => { const t = Math.round(num(s["Termómetro"])) || 0;
        return `<article class="ses"><div class="hd"><h3>Sesión ${esc(s["Sesión"] || "")} <span class="dim" style="font-weight:500">${s.Fecha ? "· " + esc(fmtD(s.Fecha, { weekday: "short", day: "numeric", month: "long" })) : ""}</span></h3>${t ? `<span class="dots" aria-label="Termómetro ${t} de 5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= t ? "on" : ""}"></i>`).join("")}</span>` : ""}</div>
        ${s.Etapa ? `<div><span class="chip warm">Etapa ${esc(s.Etapa)}${stageName(s.Etapa) ? " · " + esc(stageName(s.Etapa)) : ""}</span></div>` : ""}
        ${sec("Temas", s.Temas)}${sec("Aprendizajes", s.Aprendizajes)}${sec("Acuerdos", s.Acuerdos)}${sec("Próximos pasos", s["Próximos pasos"])}${ ""}</article>`; }).join("")}</div>`
                  : empty("La bitácora está vacía", hint("Bitácora")));
  }

  const LEVELS = ["", "Lo conozco", "Lo uso en el chat", "Lo uso con método", "Construyo para otros", "Lo mido y lo escalo"], LEVEL_TXT = [];
  T("tblNiveles").forEach((r) => { const n = parseInt(r.Nivel, 10); if (n >= 1 && n <= 5 && r.Nombre) { LEVELS[n] = String(r.Nombre); LEVEL_TXT[n] = String(r["Qué significa"] || ""); } });
  const scaleBox = () => `<div class="box"><h3>La escala</h3><ol class="levels">${[1, 2, 3, 4, 5].map((n) => `<li><span class="n mono">${n}</span><span><b>${esc(LEVELS[n])}</b>${LEVEL_TXT[n] ? `<span class="sub">${esc(LEVEL_TXT[n])}</span>` : ""}</span></li>`).join("")}</ol></div>`;
  function panelRadar() {
    const rows = T("tblRadar").filter((r) => r["Área"]);
    const has = (k) => rows.some((r) => num(r[k]) >= 1);
    const nowKey = has("Cierre") ? "Cierre" : has("Mitad del ciclo") ? "Mitad del ciclo" : null;
    const fecha = { "Línea base": cfg("radar_base"), "Mitad del ciclo": cfg("radar_mitad"), "Cierre": cfg("radar_cierre") };
    const intro = head(isV ? "Radar IA de " + F : "Tu Radar IA", `Autoevaluación del 1 al 5 en ${rows.length} áreas. La primera es la línea base; se repite a mitad y al final del ciclo.`);
    const areas = rows.length ? `<div class="tbl-wrap"><table class="wrap"><thead><tr><th>Área</th><th>Qué incluye</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${esc(r["Área"])}</b></td><td>${esc(r["Qué incluye"] || "")}</td></tr>`).join("")}</tbody></table></div>` : "";
    if (!has("Línea base")) return intro + empty("Aún no hay evaluación", isV ? `Captura la línea base de ${F} en la hoja «Radar IA» y vuelve a generar las páginas.` : `Califícate del 1 al 5 en cada área con la escala y mándale tus números a ${M}.`) + `<div class="radar-0">${areas}${scaleBox()}</div>`;
    const x = (v) => ((Math.max(1, Math.min(5, v)) - 1) / 4) * 100;
    const legendItem = (cls, k) => `<span><i class="${cls}"></i>${esc(k)}${fecha[k] ? " · " + esc(fmtD(fecha[k], { day: "numeric", month: "short" })) : ""}</span>`;
    const legend = nowKey ? legendItem("sw-base", "Línea base") + legendItem("sw-now", nowKey) : legendItem("sw-now", "Línea base") + `<span class="dim">Al repetir la evaluación verás el avance</span>`;
    const grid = [1, 2, 3, 4, 5].map((v) => `<span class="g" style="left:${x(v)}%"></span>`).join("");
    const body = rows.map((r) => {
      const b = num(r["Línea base"]), n = nowKey ? num(r[nowKey]) : NaN;
      let marks = "", delta = "", tip = "";
      if (b >= 1 && n >= 1) {
        const lo = Math.min(b, n), hi = Math.max(b, n), d = n - b;
        marks = `<span class="conn" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></span><span class="dot base" style="left:${x(b)}%"></span><span class="dot now" style="left:${x(n)}%"></span>`;
        delta = `<span class="delta ${d === 0 ? "zero" : ""}">${d > 0 ? "+" + d : d === 0 ? "=" : d}</span>`;
        tip = `${r["Área"]}: ${b} (${LEVELS[b] || ""}) → ${n} (${LEVELS[n] || ""})`;
      } else if (b >= 1) { marks = `<span class="dot now" style="left:${x(b)}%"></span>`; delta = `<span class="delta zero">${b}</span>`; tip = `${r["Área"]}: ${b} (${LEVELS[b] || ""})`; }
      return `<div class="db-row" tabindex="0" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="name">${esc(r["Área"])}</span><div class="db-track">${grid}${marks}</div>${delta}</div>`;
    }).join("");
    const table = `<div class="tbl-wrap"><table><thead><tr><th>Área</th><th>Línea base</th><th>Mitad del ciclo</th><th>Cierre</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r["Área"])}</td><td class="num">${esc(r["Línea base"] || "–")}</td><td class="num">${esc(r["Mitad del ciclo"] || "–")}</td><td class="num">${esc(r.Cierre || "–")}</td></tr>`).join("")}</tbody></table></div>`;
    return intro + `<div class="radar-1"><div class="chart"><div class="legend">${legend}</div><div class="db-axis"><span></span><div class="ticks">${[1, 2, 3, 4, 5].map((v) => `<span style="left:${x(v)}%">${v}</span>`).join("")}</div><span></span></div>${body}<p class="scale-note">${[1, 2, 3, 4, 5].map((n) => n + " " + esc(LEVELS[n])).join(" · ")}</p></div>${table}</div>${scaleBox()}`;
  }

  

  // ---------- Láminas: la sesión 1 como «El modelo, en 8 láminas» ----------
  //  Una lámina de portada, una por bloque de la hoja «Sesión 1» y una del ciclo. Todo sale del Excel.
  //  La versión de Fernando es la que se proyecta; la de Valeria agrega sus notas, su demo y la Prueba B.
  function laminas() {
    const nx = cfg("proxima");
    const kick = (t) => `<div class="l-kick">${esc(t)}</div>`;
    const numTo = (n) => `<span data-to="${n}">${n}</span>`;
    const tile = (lab, val, p, cls = "") => `<div class="l-tile hl"><div class="l-lab">${esc(lab)}</div><div class="l-val ${cls}">${val}</div>${p ? `<p>${esc(p)}</p>` : ""}</div>`;
    const pane = (title, items, cls = "") => (items.length ? `<div class="l-pane ${cls}"><h3>${esc(title)}</h3><ul>${items.map(li).join("")}</ul></div>` : "");
    const quotes = (qs) => `<div class="l-qs">${qs.map((q) => `<p>“${esc(q.replace(/^[“"«]+|[”"»]+$/g, ""))}”</p>`).join("")}</div>`;
    const out = [];

    out.push(`${kick(`Mentoría en IA · ${cfg("programa") || "MentorcliQ"} · Sesión 1${nx ? " · " + fmtD(nx, { weekday: "long", day: "numeric", month: "long" }) : ""}`)}
      <h1 class="l-h1">${esc(M)} <em>×</em> ${esc(F)}</h1>${cfg("promesa") ? `<div class="l-sub">${esc(cfg("promesa"))}</div>` : ""}<div class="l-rule"></div>
      <div class="l-g4">${tile("Sesiones del ciclo", numTo(CICLO.length), CICLO[0] && CICLO[0].Enfoque ? "Hoy: " + CICLO[0].Enfoque : "")}${tile("Etapas MentorcliQ", numTo(ETAPAS.length), "Hoy: " + stageName(stageNow))}${tile("Áreas del Radar IA", numTo(T("tblRadar").filter((r) => r["Área"]).length), LEVELS[4] ? `Del 1 al 5: el 4 es «${LEVELS[4]}»` : "")}${tile("Proyecto ancla", ancla ? "Elegido" : "Hoy", ancla || "Algo que construyes, mides y presentas en el demo day", ancla ? "ok" : "acc")}</div>
      ${AG.length ? `<div class="l-agenda">${AG.map((r) => `<div><b>${esc(fmtHora(r.Hora))}</b><span>${esc(r["Título"])}</span><small>${esc(num(r.Minutos) || "")} min</small></div>`).join("")}</div>` : ""}`);

    const radarL = () => {
      const rows = T("tblRadar").filter((r) => r["Área"]);
      const escala = `<div class="l-scale">${[1, 2, 3, 4, 5].map((n) => `<div class="${n >= 4 ? "hi" : ""}"><b>${n}</b><span>${esc(LEVELS[n])}</span></div>`).join("")}</div>`;
      if (!rows.some((r) => num(r["Línea base"]) >= 1)) return `<div class="l-areas">${rows.map((r) => `<div><b>${esc(r["Área"])}</b><span>${esc(r["Qué incluye"] || "")}</span></div>`).join("")}</div>${escala}`;
      return `<div class="l-bars">${rows.map((r) => { const b = num(r["Línea base"]) || 0; return `<div class="l-hb"><span class="t">${esc(r["Área"])}</span><span class="w"><i style="--to:${(b / 5) * 100}%"></i></span><span class="n">${b || "–"}</span></div>`; }).join("")}</div>${escala}`;
    };
    const acuerdoL = () => `<div class="l-agr">${T("tblAcuerdo").filter((r) => r.Tema).map((r) => `<div><b>${esc(r.Tema)}</b><span class="${r["Lo que acordamos"] ? "" : "dim"}">${esc(r["Lo que acordamos"] || (r.Ejemplo ? "Por ejemplo: " + r.Ejemplo : "Por definir"))}</span></div>`).join("")}</div>`;
    const metasL = () => {
      const g = GOALS(F), s = SUGG(F).slice(0, 6);
      const top = `<div class="l-ancla"><span>Proyecto ancla</span><b>${esc(ancla || "Lo elegimos hoy")}</b></div>`;
      if (g.length) return top + `<div class="l-g3">${g.map((x) => `<div class="l-tile hl"><div class="l-lab">${esc(x["Área"] || "Meta")}</div><h3>${esc(x.Meta)}</h3>${x["M · Medible"] ? `<p>${esc(x["M · Medible"])}</p>` : ""}<div class="l-meter"><i style="--to:${Math.round(pctOf(x) * 100)}%"></i></div></div>`).join("")}</div>`;
      return top + `<div class="l-g3">${s.map((x) => `<div class="l-tile"><div class="l-lab">${esc(x["Área"] || "")}${x["Plazo (días)"] ? " · " + esc(x["Plazo (días)"]) + " días" : ""}</div><h3>${esc(x.Meta)}</h3>${x["M · Medible"] ? `<p>${esc(x["M · Medible"])}</p>` : ""}</div>`).join("")}</div>`;
    };
    const cierreL = () => {
      const pend = ACTS.filter((a) => !yes(a.Estado));
      return `<div class="l-g3">${tile("Próxima sesión", nx ? esc(fmtD(nx, { day: "numeric", month: "short" })) : "Por agendar", nx ? fmtD(nx, { weekday: "long" }) : "La agendas tú: llevas el volante", nx ? "" : "acc")}
        <div class="l-tile hl"><div class="l-lab">Termómetro de hoy</div><div class="l-thermo">${[1, 2, 3, 4, 5].map((n) => `<span>${n}</span>`).join("")}</div><p>¿Qué tan útil fue esta hora?</p></div>
        ${tile("Compromisos", numTo(pend.length), pend.length ? pend.slice(0, 2).map((a) => a.Compromiso).join(" · ") : "Uno para cada quien, con fecha")}</div>${leerL()}`;
    };
    const leerL = () => {
      const sig = (num((CICLO.find((c) => !yes(c.Hecho)) || {})["Sesión"]) || 1) + 1, ls = lectDe(sig, F).filter((l) => okUrl(l.Liga));
      return ls.length ? `<div class="l-read"><span class="l-lab">Para leer antes de la sesión ${sig}</span>${ls.map((l) => `<a href="${esc(l.Liga)}" target="_blank" rel="noopener">${esc(l["Título"])}<small>${esc([l.Autor, l.Formato, l.Minutos ? l.Minutos + " min" : ""].filter(Boolean).join(" · "))}</small></a>`).join("")}</div>` : "";
    };
    

    const tipo = (t) => (/rompehielos/i.test(t) ? "rompe" : /diagn|techo|radar/i.test(t) ? "radar" : /acuerdo/i.test(t) ? "acuerdo" : /meta|ancla/i.test(t) ? "metas" : /cierre|compromiso/i.test(t) ? "cierre" : "");
    AG.forEach((r) => {
      const et = parseInt(r.Etapa, 10), mins = num(r.Minutos) || 0, his = lines(r["Le toca a Fernando"]), qs = lines(r.Preguntas), k = tipo(r["Título"]);
      let body = "";
      if (k === "rompe") body = `<div class="l-g3">${T("tblRompehielos").filter((o) => o.Nombre).map((o) => `<div class="l-tile hl"><div class="l-lab">Opción ${esc(o["Opción"])}</div><h3>${esc(o.Nombre)}</h3><p>${esc(o["Cómo funciona"])}</p></div>`).join("")}</div>`;
      else if (k === "radar") body = radarL();
      else if (k === "acuerdo") body = acuerdoL();
      else if (k === "metas") body = metasL();
      else if (k === "cierre") body = cierreL();
      const lado = his.length || qs.length ? `<div class="l-duo" style="margin-top: ${body ? 26 : 0}px">${pane("Lo que te toca", his, "me")}${qs.length ? `<div class="l-pane"><h3>${qs.length > 1 ? "Preguntas" : "Pregunta"}</h3>${quotes(qs)}</div>` : ""}</div>` : "";
      const notas =  "";
      out.push(`${kick(`${fmtHora(r.Hora)} · ${mins} min · Etapa ${et || "–"}${stageName(et) ? " · " + stageName(et) : ""}`)}<h2 class="l-h2">${esc(r["Título"])}</h2>${r["Para lograr"] ? `<div class="l-sub">${esc(r["Para lograr"])}</div>` : ""}<div class="l-rule"></div>${body}${lado}${notas}`);
      
    });

    if (CICLO.length) {
      const cur = Math.max(0, CICLO.findIndex((c) => !yes(c.Hecho)));
      out.push(`${kick("Después de hoy")}<h2 class="l-h2">${CICLO.length} sesiones alrededor de tu proyecto ancla</h2><div class="l-rule"></div>
        <div class="l-ciclo">${CICLO.map((c, i) => `<div class="${i === cur ? "now" : ""}${yes(c.Hecho) ? " ok" : ""}"><span class="n">${esc(c["Sesión"])}</span>${c.Fecha ? `<small>${esc(fmtD(c.Fecha, { day: "numeric", month: "short" }))}</small>` : ""}<b>${esc(c.Enfoque)}</b><p>${esc(c.Entregable || "")}</p>${lectDe(num(c["Sesión"]), F)[0] ? `<em class="l-lec">Lectura: ${esc(lectDe(num(c["Sesión"]), F)[0]["Título"])}</em>` : ""}</div>`).join("")}</div>`);
    }
    return out;
  }

  function montarLaminas() {
    const frames = laminas();
    document.documentElement.classList.add("lam-html");
    document.body.className = "lam";
    document.title = `${isV ? "Mis láminas · " : ""}Sesión 1 · ${M} × ${F}`;
    document.body.innerHTML = `<div id="l-stage"><div id="l-canvas">${frames.map((h, i) => `<section class="l-frame" id="lf${i}">${h}</section>`).join("")}</div></div>
      <div id="l-hud"><span id="l-num"></span><br>${isV ? '<b class="l-warn">Tu versión con notas · no la proyectes</b>' : `Mentoría ${esc(M)} × ${esc(F)}`}</div>
      <div id="l-hint"><kbd>←</kbd> <kbd>→</kbd> avanzar · <kbd>Esc</kbd> vista completa · clic en una lámina para abrirla</div><nav id="l-nav" aria-label="Láminas"></nav>`;
    const cv = $("#l-canvas"), nav = $("#l-nav"), els = $$(".l-frame"), W = 1600, GAP = 160, COLS = 3, pos = [];
    els.forEach((el) => (el.style.width = W + "px"));
    let y = 0;
    for (let i = 0; i < els.length; i += COLS) {
      const fila = els.slice(i, i + COLS), h = Math.max(...fila.map((e) => e.offsetHeight));
      fila.forEach((e, j) => { e.style.left = j * (W + GAP) + "px"; e.style.top = y + "px"; pos.push({ x: j * (W + GAP), y }); });
      y += h + GAP;
    }
    const CW = Math.min(COLS, els.length) * W + (Math.min(COLS, els.length) - 1) * GAP, CH = y - GAP;
    cv.style.width = CW + "px"; cv.style.height = CH + "px";
    let cur = 0, over = false;
    const contar = (fr) => $$("[data-to]", fr).forEach((e) => {
      const to = parseFloat(e.dataset.to), t0 = performance.now();
      if (isNaN(to)) return;
      const tick = (t) => { const u = Math.min(1, (t - t0) / 1100), k = 1 - Math.pow(1 - u, 3); e.textContent = String(Math.round(to * k)); if (u < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
    const apply = () => {
      const vw = innerWidth, vh = innerHeight;
      if (vw < 40 || vh < 40) { setTimeout(apply, 120); return; }      // la ventana todavía no tiene tamaño
      let x, yy, w, h, pad;
      if (over) { x = 0; yy = 0; w = CW; h = CH; pad = 0.93; } else { x = pos[cur].x; yy = pos[cur].y; w = W; h = els[cur].offsetHeight; pad = 0.9; }
      const s = Math.min(vw / w, vh / h) * pad;
      cv.style.transform = `translate(${vw / 2}px, ${vh / 2}px) scale(${s}) translate(${-(x + w / 2)}px, ${-(yy + h / 2)}px)`;
      els.forEach((el, k) => { const on = over || k === cur, was = el.classList.contains("l-on"); el.classList.toggle("l-on", on); if (on && !was) contar(el); });
      $$("button", nav).forEach((b, k) => b.classList.toggle("on", !over && k === cur));
      $("#l-num").innerHTML = over ? "<b>Vista completa</b>" : `Lámina <b>${cur + 1}</b> de ${els.length}`;
    };
    const go = (i) => { cur = (i + els.length) % els.length; over = false; apply(); };
    els.forEach((el, i) => {
      el.addEventListener("click", (e) => { if (e.target.closest("button, a")) return; if (over || i !== cur) go(i); });
      const b = document.createElement("button"); b.type = "button"; b.title = "Lámina " + (i + 1); b.addEventListener("click", () => go(i)); nav.appendChild(b);
    });
    addEventListener("keydown", (e) => {
      const k = e.key;
      if (k === "ArrowRight" || k === " " || k === "PageDown") { e.preventDefault(); go(cur + 1); }
      else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(cur - 1); }
      else if (k === "Escape") { over = !over; apply(); }
      else if (k === "Home") go(0);
      else if (k === "End") go(els.length - 1);
    });
    addEventListener("resize", apply);
    addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= els.length) go(n - 1); });
    const n0 = parseInt((location.hash || "").slice(1), 10);              // #N abre directo en la lámina N
    if (n0 >= 1 && n0 <= els.length) cur = n0 - 1;
    setTimeout(() => { cv.style.transition = "none"; apply(); void cv.offsetWidth; setTimeout(() => (cv.style.transition = ""), 50); }, 60);   // la primera vez, sin animación
  }

  const PANELS = { sesion1: panelSesion, cadaquien: panelCada, ruta: panelRuta, lecturas: panelLecturas, acuerdo: panelAcuerdo, metas: panelMetas, compromisos: panelCompromisos, bitacora: panelBitacora, radar: panelRadar,  };

  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(([id, label]) => `<button class="tab" role="tab" id="tab-${id}" aria-controls="${id}" aria-selected="false" type="button">${esc(label)}</button>`).join("");
    $("#main").innerHTML = TABS.map(([id]) => `<section id="${id}" role="tabpanel" aria-labelledby="tab-${id}" hidden>${PANELS[id]()}</section>`).join("");
  }
  function showTab(t) {
    if (!TABS.some(([id]) => id === t)) t = "sesion1";
    TABS.forEach(([id]) => { $("#" + id).hidden = id !== t; const b = $("#tab-" + id); b.setAttribute("aria-selected", String(id === t)); b.tabIndex = id === t ? 0 : -1; });
    ls.set("tab", t);
  }

  function renderFooter() {
    const gen = DATA && DATA._meta && DATA._meta.generado;
    const links = [];
    if (isV && cfg("pagina_fernando")) links.push(`<a href="${esc(cfg("pagina_fernando"))}" target="_blank" rel="noopener">Página de ${esc(F)}</a>`);
    if (/^https?:\/\//i.test(String(cfg("carpeta") || ""))) links.push(`<a href="${esc(cfg("carpeta"))}" target="_blank" rel="noopener">Seguimiento compartido</a>`);
    $("#footer").innerHTML = `<span>${gen ? "Actualizado el " + esc(fmtD(gen.slice(0, 10), { day: "numeric", month: "long", year: "numeric" })) + " a las " + esc(gen.slice(11, 16)) : ""}${gen ? " · " : ""}Etapas: Building Rapport, Setting Direction, Relationship Progression, Winding Down y Moving On (MentorcliQ).</span>${links.length ? `<span>${links.join(" · ")}</span>` : ""}`;
  }

  // ---------- Session clock (per browser) ----------
  let clock = ls.get("clock", { start: null, acc: 0 }), clockT = null;
  const elapsed = () => clock.acc + (clock.start ? (Date.now() - clock.start) / 1000 : 0);
  function renderClock() {
    if (!$("#clock")) return;
    const s = Math.floor(elapsed()), over = s > 3600, shown = over ? s - 3600 : s;
    $("#clock-time").innerHTML = (over ? "+" : "") + pad(Math.floor(shown / 60)) + ":" + pad(shown % 60) + " <small>" + (over ? "tiempo extra" : "/ 60:00") + "</small>";
    $("#clock-bar").style.width = Math.min(100, (s / 3600) * 100) + "%";
    $("#clock").classList.toggle("over", over);
    const min = s / 60, running = clock.start || clock.acc;
    let cur = null;
    $$(".blk").forEach((b) => { const f = parseFloat(b.dataset.from), t = parseFloat(b.dataset.to); const on = !!running && !isNaN(f) && !isNaN(t) && min >= f && min < t; b.classList.toggle("is-now", on); if (on) cur = b.querySelector("h3").textContent; });
    $("#clock-now").textContent = !running ? "Listo para empezar" : over ? "Hora de cerrar" : cur ? "Ahora: " + cur + (clock.start ? "" : " (en pausa)") : "";
    $("#clock-go").textContent = clock.start ? "Pausar" : clock.acc ? "Continuar" : "Iniciar";
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab"); if (tab) { showTab(tab.id.slice(4)); return; }
    const sb = e.target.closest(".stage-btn");
    if (sb) { showTab("ruta"); setTimeout(() => { const c = $("#stage-" + sb.dataset.stage); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); }, 40); return; }
    if (e.target.closest("#clock-go")) { if (clock.start) { clock.acc = elapsed(); clock.start = null; clearInterval(clockT); } else { clock.start = Date.now(); clockT = setInterval(renderClock, 1000); } ls.set("clock", clock); renderClock(); return; }
    if (e.target.closest("#clock-reset")) { clock = { start: null, acc: 0 }; clearInterval(clockT); ls.set("clock", clock); renderClock(); }
  });
  document.addEventListener("keydown", (e) => {
    if (!e.target.closest || !e.target.closest(".tabs") || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    const i = TABS.findIndex(([id]) => $("#tab-" + id).getAttribute("aria-selected") === "true");
    const n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length][0];
    showTab(n); $("#tab-" + n).focus();
  });

  // ---------- Boot ----------
  if (!DATA || !DATA.tblConfig) {
    document.body.insertAdjacentHTML("afterbegin", `<div class="wrap" style="padding-block:40px">${empty("Esta es la plantilla", "Abre la página generada en la carpeta «paginas».")}</div>`);
    return;
  }
  if (LAM) { montarLaminas(); return; }
  renderHeader(); renderTabs(); renderFooter();
  const h = (location.hash || "").slice(1);
  showTab(TABS.some(([id]) => id === h) ? h : ls.get("tab", "sesion1"));
  renderClock(); if (clock.start) clockT = setInterval(renderClock, 1000);
})();
</script>
</body>
