<title>Mentoría · acceso privado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..750&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one centered card on the page's paper ground. */
:root { --paper: #f3f6f5; --card: #ffffff; --ink: #10282c; --ink-2: #46595c; --line: #d6dfdd; --accent: #d98200; --accent-soft: #fdefd6; --rose: #b8324f;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; --f-body: "Figtree", "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --paper: #0d191b; --card: #142326; --ink: #e6efed; --ink-2: #a7b8b6; --line: #26393c; --accent: #f2a51e; --accent-soft: #33270f; --rose: #f07893; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
form { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
.lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
h1 { font-family: var(--f-display); font-size: 1.7rem; margin: 0; line-height: 1.1; }
p { margin: 0; color: var(--ink-2); line-height: 1.5; }
input[type="password"] { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; }
button { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.err { color: var(--rose); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <span class="lbl">Acceso privado</span>
  <h1>Mentoría en IA</h1>
  <p>Escribe tu contraseña para abrir tu vista.</p>
  <input type="text" name="username" value="valeria" autocomplete="username" hidden>
  <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Contraseña" required>
  <label class="rem"><input type="checkbox" id="rem"> Recordar en esta computadora</label>
  <button type="submit" id="go">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>

  const KEY = "valeria:pw";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function open(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.s), iterations: D.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.i) }, key, b64(D.c));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go"), rem = document.getElementById("rem");
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Abriendo…";
    try {
      const html = await open(pw.value.trim());
      try { if (rem.checked) localStorage.setItem(KEY, pw.value.trim()); else localStorage.removeItem(KEY); } catch {}
      show(html);
    } catch {
      err.textContent = "Esa contraseña no es. Revisa que esté completa, con los guiones.";
      go.disabled = false; go.textContent = "Entrar"; pw.select();
    }
  });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) { pw.value = saved; rem.checked = true; open(saved).then(show).catch(() => { try { localStorage.removeItem(KEY); } catch {} }); }
  else pw.focus();
})();
